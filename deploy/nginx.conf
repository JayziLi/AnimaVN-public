server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 角色卡 PNG、对话 jsonl 导入都从这儿过。默认 1m 对一张带头像的卡就不够
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 整站一道门。放在 server 层,下面每个 location 都继承,
    # 包括 /api/ —— 免得静态页要密码而接口裸奔
    auth_basic           "AnimaVN";
    auth_basic_user_file /etc/nginx/htpasswd;

    # ---------- 接口 ----------
    location /api/ {
        # 末尾不带斜杠 = 保留 /api 前缀,后端路由本来就带
        proxy_pass http://backend:8000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/debug/stream 是 SSE。不关缓冲的话 nginx 会攒着一起吐,
        # 流式输出就退化成"转半天然后整段蹦出来" —— 这条是必须的
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;

        # 一次生成经常超过 nginx 默认的 60s,超时会被掐成 504
        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # ---------- 静态 ----------
    # vite 产物带内容哈希(debug-CfbLHg51.js),永不变,可以死缓存。
    # 注意不能整个 /assets/ 一起缓存 —— public/assets/ 下面还有没带哈希的图标和默认头像,
    # 换图之后必须能刷出来。下面只认「名字-哈希.js/css」这种形状。
    # 整条正则必须加引号:nginx 把裸 { } 当块的开闭符,{8,} 会被解析成
    # 指令边界然后 [emerg] unknown directive —— 容器起不来
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 视觉小说的示例素材(背景、BGM、示例立绘):短缓存,换了刷一下就能看见。
    # 用户自己传的立绘、场景包走 /api/,不经过这里
    location ~ ^/vn/ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # debug.html 不能缓存,否则改了前端用户还拿旧的;index.html 只是跳到 debug.html 的一页
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /debug.html { add_header Cache-Control "no-cache"; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
