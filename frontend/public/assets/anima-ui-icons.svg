<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!--
      AnimaBackend UI icon set
      Grid: 24 x 24 · Stroke: 1.7 · Round caps and joins
      All symbols inherit currentColor from the consuming button.
    -->
    <symbol id="preset" viewBox="0 0 24 24">
      <rect x="4" y="4" width="16" height="4" rx="1.5"/>
      <rect x="4" y="10" width="12" height="4" rx="1.5"/>
      <rect x="4" y="16" width="14" height="4" rx="1.5"/>
    </symbol>

    <symbol id="character-card" viewBox="0 0 24 24">
      <rect x="3.5" y="3.5" width="17" height="17" rx="3"/>
      <circle cx="9" cy="9" r="2.25"/>
      <path d="M5.75 16.5c.65-2.15 1.75-3.25 3.25-3.25s2.6 1.1 3.25 3.25M15 8h3M15 11h3M15 14h2"/>
    </symbol>

    <symbol id="player" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="3.25"/>
      <path d="M5.5 19.5c.65-4 2.8-6 6.5-6s5.85 2 6.5 6"/>
    </symbol>

    <symbol id="more" viewBox="0 0 24 24">
      <circle cx="5" cy="12" r="1" fill="currentColor" stroke="none"/>
      <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>
      <circle cx="19" cy="12" r="1" fill="currentColor" stroke="none"/>
    </symbol>

    <symbol id="import" viewBox="0 0 24 24">
      <path d="M12 3.5v10M8.5 10l3.5 3.5 3.5-3.5"/>
      <path d="M5 15.5v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/>
    </symbol>

    <symbol id="export" viewBox="0 0 24 24">
      <path d="M12 14V4M8.5 7.5 12 4l3.5 3.5"/>
      <path d="M5 13.5v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>
    </symbol>

    <symbol id="add" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14"/>
    </symbol>

    <symbol id="edit" viewBox="0 0 24 24">
      <path d="m14.75 5.25 4 4M5 19l1.15-4.6L15.8 4.75a1.8 1.8 0 0 1 2.55 0l.9.9a1.8 1.8 0 0 1 0 2.55L9.6 17.85 5 19Z"/>
      <path d="m6.15 14.4 3.45 3.45"/>
    </symbol>

    <symbol id="copy" viewBox="0 0 24 24">
      <rect x="8" y="8" width="11.5" height="11.5" rx="2"/>
      <path d="M16 8V6.5a2 2 0 0 0-2-2H6.5a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2H8"/>
    </symbol>

    <symbol id="save" viewBox="0 0 24 24">
      <path d="M5 4h11l3 3v12a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19V4Z"/>
      <path d="M8 4v5h7V4M8.5 20.5v-6h7v6"/>
    </symbol>

    <symbol id="restore" viewBox="0 0 24 24">
      <path d="M5 8V4.5M5 8h3.5"/>
      <path d="M5.5 7.5A7.5 7.5 0 1 1 4.8 15"/>
      <path d="M12 8v4.5l3 1.75"/>
    </symbol>

    <symbol id="delete" viewBox="0 0 24 24">
      <path d="M4.5 7h15M9 7V4.5h6V7M7 7l.75 13h8.5L17 7"/>
      <path d="M10 10.5v6M14 10.5v6"/>
    </symbol>

    <symbol id="list" viewBox="0 0 24 24">
      <circle cx="5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
      <circle cx="5" cy="12" r="1" fill="currentColor" stroke="none"/>
      <circle cx="5" cy="17.5" r="1" fill="currentColor" stroke="none"/>
      <path d="M9 6.5h10M9 12h10M9 17.5h10"/>
    </symbol>

    <!-- 视觉小说模式:画面里一个人物,底下一条对话框 -->
    <symbol id="vn" viewBox="0 0 24 24">
      <rect x="3" y="3.5" width="18" height="17" rx="2.5"/>
      <circle cx="12" cy="8.25" r="2.1"/>
      <path d="M8.4 14c.55-1.75 1.75-2.7 3.6-2.7s3.05.95 3.6 2.7"/>
      <rect x="6" y="15.5" width="12" height="2.5" rx="1"/>
    </symbol>

    <!-- 插件:一个插头 -->
    <symbol id="plugin" viewBox="0 0 24 24">
      <path d="M9 3.5v4.5M15 3.5v4.5"/>
      <path d="M6.5 8h11v3a5.5 5.5 0 0 1-11 0z"/>
      <path d="M12 16.5v4"/>
    </symbol>

    <symbol id="sliders" viewBox="0 0 24 24">
      <path d="M4 6h6M14 6h6M4 12h10M18 12h2M4 18h3M11 18h9"/>
      <circle cx="12" cy="6" r="2"/>
      <circle cx="16" cy="12" r="2"/>
      <circle cx="9" cy="18" r="2"/>
    </symbol>

    <symbol id="branch" viewBox="0 0 24 24">
      <circle cx="6" cy="5" r="2"/>
      <circle cx="18" cy="6" r="2"/>
      <circle cx="18" cy="18" r="2"/>
      <path d="M6 7v5a6 6 0 0 0 6 6h4M8 9h4a6 6 0 0 0 6-6v1"/>
    </symbol>

    <symbol id="history" viewBox="0 0 24 24">
      <path d="M5 8V4.5M5 8h3.5"/>
      <path d="M5.5 7.5A7.5 7.5 0 1 1 4.8 15"/>
      <path d="M12 7.5V12l3 2"/>
    </symbol>

    <symbol id="new-chat" viewBox="0 0 24 24">
      <path d="M5 5.5h14v10H9l-4 3v-13Z"/>
      <path d="M12 8v5M9.5 10.5h5"/>
    </symbol>

    <symbol id="refresh" viewBox="0 0 24 24">
      <path d="M18.5 8A7.5 7.5 0 0 0 5 7M5 7V3.5M5 7h3.5"/>
      <path d="M5.5 16A7.5 7.5 0 0 0 19 17M19 17v3.5M19 17h-3.5"/>
    </symbol>

    <symbol id="jump-latest" viewBox="0 0 24 24">
      <path d="M12 4v10M8.5 10.5 12 14l3.5-3.5M5 20h14"/>
    </symbol>

    <symbol id="panel-left" viewBox="0 0 24 24">
      <rect x="3.5" y="4" width="17" height="16" rx="2"/>
      <path d="M9 4v16M15 9l-3 3 3 3"/>
    </symbol>

    <symbol id="panel-right" viewBox="0 0 24 24">
      <rect x="3.5" y="4" width="17" height="16" rx="2"/>
      <path d="M15 4v16M9 9l3 3-3 3"/>
    </symbol>
  </defs>
</svg>
